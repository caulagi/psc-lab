<!doctype html><html><head><meta charset="utf-8"><style>
  /* Dark "structure" composition fed to Stability control-structure.
     Glowing edges on a dark background → used for dark renders
     (blueprint, neon/glow heroes). Same layout as control-light. */
  html,body{margin:0;padding:0}
  .stage{width:1280px;height:720px;background:#0a0e1a;position:relative;overflow:hidden}
  .platform{position:absolute;top:300px;width:320px;height:150px;border-radius:24px;
    border:6px solid #cfe3ff;background:#1a2236}
  .left{left:120px}.right{right:120px}
  .node{position:absolute;border-radius:16px;border:5px solid #bfe9ff;background:#223049}
  .s{width:70px;height:70px;top:40px}
  .l1{left:160px}.l2{left:255px}.r1{right:255px}.r2{right:160px}
  .endpoint{width:96px;height:96px;left:592px;top:312px;border-radius:50%;
    border:7px solid #7fe9ff;background:#16324a}
  .wire{position:absolute;top:374px;left:440px;width:400px;height:10px;border-radius:6px;
    background:#9fe8ff}
  .cube{position:absolute;width:46px;height:46px;border:4px solid #9fb8e0;
    background:#161e30;border-radius:8px;transform:rotate(45deg)}
  .c1{left:300px;top:170px}.c2{right:300px;top:520px}.c3{left:640px;top:150px}
</style></head><body>
<div class="stage">
  <div class="wire"></div>
  <div class="platform left"><div class="node s l1"></div><div class="node s l2"></div></div>
  <div class="platform right"><div class="node s r1"></div><div class="node s r2"></div></div>
  <div class="node endpoint"></div>
  <div class="cube c1"></div><div class="cube c2"></div><div class="cube c3"></div>
</div>
</body></html>
