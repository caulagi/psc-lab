<!doctype html><html><head><meta charset="utf-8"><style>
  /* Light "structure" composition fed to Stability control-structure.
     Strong, clean edges on a light background → guides layout while the
     prompt drives style/colour. Used for the editorial (light) renders. */
  html,body{margin:0;padding:0}
  .stage{width:1280px;height:720px;background:#ffffff;position:relative;overflow:hidden}
  .platform{position:absolute;top:300px;width:320px;height:150px;border-radius:24px;
    border:6px solid #20304f;background:#e8eef7}
  .left{left:120px}.right{right:120px}
  .node{position:absolute;border-radius:16px;border:5px solid #2a3c5e;background:#dbe4f2}
  .s{width:70px;height:70px;top:40px}
  .l1{left:160px}.l2{left:255px}.r1{right:255px}.r2{right:160px}
  .endpoint{width:96px;height:96px;left:592px;top:312px;border-radius:50%;
    border:7px solid #16324a;background:#cfe0f5}
  .wire{position:absolute;top:374px;left:440px;width:400px;height:10px;border-radius:6px;
    background:#2a3c5e}
  .cube{position:absolute;width:46px;height:46px;border:4px solid #34507e;
    background:#e8eef7;border-radius:8px;transform:rotate(45deg)}
  .c1{left:300px;top:170px}.c2{right:300px;top:520px}.c3{left:640px;top:150px}
</style></head><body>
<div class="stage">
  <div class="wire"></div>
  <div class="platform left"><div class="node s l1"></div><div class="node s l2"></div></div>
  <div class="platform right"><div class="node s r1"></div><div class="node s r2"></div></div>
  <div class="node endpoint"></div>
  <div class="cube c1"></div><div class="cube c2"></div><div class="cube c3"></div>
</div>
</body></html>
